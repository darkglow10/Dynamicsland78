name: Build Android APK from Zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: List repository files
      run: ls -la

    - name: Unzip project archive
      run: |
        unzip -q DynamicIsland.zip
        ls -la

    - name: Find project and build APK
      run: |
        echo "Searching for gradlew..."
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "HATA: gradlew dosyası bulunamadı! Sunucudaki klasör yapısı:"
          find . -maxdepth 3
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Proje klasörü bulundu: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
