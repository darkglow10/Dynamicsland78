name: Build Android APK from Zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and extract zip archive
      run: |
        ZIP_FILE=$(find . -maxdepth 1 \( -name "*.zip" -o -name "*.ZIP" \) | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "HATA: .zip dosyası bulunamadı!"
          exit 1
        fi
        echo "Bulunan zip: $ZIP_FILE"
        unzip -q "$ZIP_FILE"

    - name: Build APK and Auto-Generate Gradle if missing
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        # Android SDK lisanslarını otomatik tanımla
        mkdir -p $ANDROID_SDK_ROOT/licenses
        echo "24333f8a43b682527c07440d6350f5c15e6b2c13" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb139a648b0" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license

        # gradlew dosyasını ara
        GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Uyarı: gradlew dosyası zip içinde yok, Gradle kuruluyor ve oluşturuluyor..."
          sudo apt-get update && sudo apt-get install -y gradle
          
          BUILD_GRADLE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_GRADLE" ]; then
            echo "HATA: Projede build.gradle dosyası da bulunamadı! Bu geçerli bir Android projesi değil."
            find . -maxdepth 3
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_GRADLE")
          cd "$PROJECT_DIR"
          gradle wrapper
          GRADLEW_PATH="./gradlew"
        else
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
        fi

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
