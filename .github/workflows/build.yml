name: Build Android APK from Zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip project archive
      run: |
        unzip DynamicIsland.zip

    - name: Grant execute permission for gradlew
      run: chmod +x DynamicIsland/gradlew

    - name: Build debug APK
      working-directory: DynamicIsland
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: DynamicIsland/app/build/outputs/apk/debug/app-debug.apk
